<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demostración interactiva de la escritura horizontal de Iteris.">
  <title>Iteris · Escritura horizontal</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182a3d;
      --secondary: #4a5d6d;
      --line: #ccd9df;
      --paper: #f0f5f5;
      --teal: #075a59;
      --warm: #a5482d;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-family: system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #258780; outline-offset: 3px; }

    .shell { width: min(100% - 2.5rem, 72rem); margin-inline: auto; }
    header {
      border-bottom: 1px solid var(--line);
      background: #f9fbfb;
    }
    .brand {
      min-height: 3.8rem;
      display: flex;
      align-items: center;
      gap: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: .55rem;
      color: white;
      background: var(--ink);
    }
    .brand-mark svg { width: 1rem; height: 1.4rem; }
    main { padding-block: clamp(1.8rem, 4vw, 3.7rem) 2.5rem; }
    h1, h2, p { margin: 0; }
    h1 {
      font: 500 clamp(2.55rem, 6vw, 4.75rem)/1.03 Georgia, serif;
      letter-spacing: -.058em;
    }
    .intro { margin-top: .7rem; color: var(--secondary); font-size: 1.03rem; }
    .workbench {
      margin-top: 1.75rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 14px 38px #1934470c;
      overflow: hidden;
    }
    .controls, .result-header, .reading-key { padding: 1.15rem clamp(.95rem, 3vw, 1.65rem); }
    .input-label { display: block; font-weight: 700; margin-bottom: .45rem; }
    .number-input {
      display: block;
      width: 100%;
      min-height: 3.1rem;
      border: 1px solid #9eb4bb;
      border-radius: .55rem;
      background: #fbfdfd;
      color: var(--ink);
      padding: .65rem .85rem;
      font: 500 1.1rem/1.35 var(--mono);
    }
    .number-input[aria-invalid="true"] { border-color: var(--warm); }
    .hint { margin-top: .4rem; color: var(--secondary); font-size: .875rem; }
    .hint.is-error { color: #923820; }
    .examples {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem;
      margin-top: .9rem;
    }
    .examples > span { color: var(--secondary); font-size: .875rem; margin-right: .15rem; }
    .examples button {
      border: 1px solid var(--line);
      border-radius: .45rem;
      padding: .32rem .64rem;
      color: var(--teal);
      background: #f8fbfb;
      font-size: .875rem;
      font-weight: 600;
    }
    .examples button:hover { border-color: #8ab6b0; background: #e4f2ef; }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .6rem 1.3rem;
      border-top: 1px solid var(--line);
    }
    h2 { font-size: 1.02rem; }
    .counts { color: var(--secondary); font-size: .875rem; margin-top: .18rem; }
    .toggle { display: flex; align-items: center; gap: .45rem; font-size: .9rem; cursor: pointer; }
    .toggle input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: var(--teal); }
    .stage {
      min-width: 0;
      min-height: 10.5rem;
      display: grid;
      align-items: center;
      overflow: auto hidden;
      background-color: #edf5f4;
      background-image: radial-gradient(#b5cdca 1px, transparent 1px);
      background-size: 16px 16px;
      border-block: 1px solid var(--line);
      outline-offset: -4px;
    }
    .flow {
      display: flex;
      gap: .375rem;
      align-items: center;
      width: max-content;
      padding: .9rem 1rem;
      margin-inline: auto;
    }
    .slot { width: 3.65rem; text-align: center; flex-shrink: 0; }
    .slot.is-token { width: 1.25rem; }
    .figure {
      height: 6.25rem;
      display: grid;
      place-items: center;
      background: #f9fdfde8;
      border: 1px solid #b8cecb;
      border-radius: .42rem;
      color: var(--ink);
    }
    .figure svg { display: block; width: 100%; height: 100%; }
    .is-zero .figure { color: var(--teal); }
    .is-token .figure { border: 0; background: transparent; color: var(--warm); }
    .decimal {
      display: block;
      min-height: 1.4rem;
      margin-top: .5rem;
      color: var(--ink);
      font: 600 .9rem/1.4 var(--mono);
    }
    .is-token .decimal { color: var(--warm); }
    .flow.without-decimal .decimal { display: none; }
    .empty { color: var(--secondary); text-align: center; padding: 1.15rem; }
    .reading-key {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: .75rem 1rem;
    }
    .reading-key p { color: var(--secondary); font-size: .875rem; }
    .key-glyph { width: 2rem; height: 2.8rem; color: var(--teal); }

    @media (max-width: 30rem) {
      .shell { width: calc(100% - 1.25rem); }
      .flow { margin-inline: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="-24 0 48 100" fill="none" stroke="currentColor" stroke-width="5">
          <path d="M0 2V98 M0 12H19V30H0 M0 88H-19"/>
        </svg>
      </span>
      Iteris
    </div>
  </header>
  <main class="shell">
    <h1>Iteris horizontal</h1>
    <p class="intro">Cuatro cifras por glifo. Los bloques se leen de izquierda a derecha.</p>

    <section class="workbench" aria-label="Demostración">
      <div class="controls">
        <label for="decimal-input" class="input-label">Número decimal</label>
        <input id="decimal-input" class="number-input" type="text" value="1200000034"
               inputmode="decimal" autocomplete="off" spellcheck="false" autocapitalize="off"
               aria-describedby="input-hint" aria-invalid="false">
        <p id="input-hint" class="hint" aria-live="polite">Usa un punto para los decimales.</p>
        <div class="examples" aria-label="Números de ejemplo">
          <span>Ejemplos</span>
          <button type="button" data-number="9999">9 999</button>
          <button type="button" data-number="10000">10 000</button>
          <button type="button" data-number="1200000034">Cero intermedio</button>
          <button type="button" data-number="-0.00000001">Fracción negativa</button>
          <button type="button" data-number="31415926535897932384626433832795">32 cifras</button>
          <button type="button" data-number="3141592653589793238462643383279502884197169399375105820974944592">64 cifras</button>
        </div>
      </div>

      <div class="result-header">
        <div>
          <h2>Representación</h2>
          <p id="counts" class="counts" aria-live="polite"></p>
        </div>
        <label class="toggle">
          <input id="decimal-toggle" type="checkbox" checked>
          Mostrar decimal agrupado
        </label>
      </div>
      <div id="stage" class="stage" role="region" aria-label="Fila de glifos Iteris" tabindex="0">
        <div id="flow" class="flow"></div>
        <p id="empty" class="empty" hidden>Escribe un número para ver sus glifos.</p>
      </div>
      <div class="reading-key">
        <svg class="key-glyph" viewBox="-20 -4 40 108" aria-hidden="true">
          <path d="M0 0V100" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <div>
          <h2>Un tallo solo vale cero</h2>
          <p>Entre otros bloques, conserva el lugar de cuatro ceros.</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    "use strict";

    const svgNamespace = "http://www.w3.org/2000/svg";
    const decimalPattern = /^([+-]?)([0-9]+)(?:\.([0-9]+))?$/;
    const primitives = [
      [0, 10, 20, 10], [0, 30, 20, 30], [0, 10, 20, 30], [20, 10, 0, 30], [20, 10, 20, 30],
    ];
    const digitStrokes = [[], [0], [1], [2], [3], [0, 3], [4], [4, 0], [4, 1], [4, 0, 1]];
    const reflections = [[1, 1, 0], [-1, 1, 0], [1, -1, 100], [-1, -1, 100]];

    function parseDecimal(raw) {
      const match = decimalPattern.exec(raw.trim());
      if (!match) return null;

      const [, sign, integerDigits, fractionalDigits = ""] = match;
      const integer = integerDigits.replace(/^0+/, "") || "0";
      const fraction = fractionalDigits.replace(/0+$/, "");
      const negative = sign === "-" && (integer !== "0" || fraction.length > 0);
      const integerBlocks = integer.padStart(Math.ceil(integer.length / 4) * 4, "0").match(/.{4}/g);
      const fractionalBlocks = fraction.padEnd(Math.ceil(fraction.length / 4) * 4, "0").match(/.{4}/g) || [];
      return { negative, integer, fraction, integerBlocks, fractionalBlocks };
    }

    function svgElement(name, attributes) {
      const element = document.createElementNS(svgNamespace, name);
      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
      return element;
    }

    function nodePath(block) {
      const commands = ["M0 0V100"];
      for (const [index, [xSign, ySign, yOffset]] of reflections.entries()) {
        const digit = block.charCodeAt(3 - index) - 48;
        for (const stroke of digitStrokes[digit]) {
          const [x1, y1, x2, y2] = primitives[stroke];
          commands.push(`M${xSign * x1} ${yOffset + ySign * y1}L${xSign * x2} ${yOffset + ySign * y2}`);
        }
      }
      return commands.join(" ");
    }

    function slot(label, svg, className = "") {
      const cell = document.createElement("div");
      cell.className = className ? `slot ${className}` : "slot";
      const figure = document.createElement("div");
      figure.className = "figure";
      figure.append(svg);
      const decimal = document.createElement("span");
      decimal.className = "decimal";
      decimal.textContent = label;
      cell.append(figure, decimal);
      return cell;
    }

    function glyph(block, label) {
      const svg = svgElement("svg", { viewBox: "-27 -6 54 112", role: "img", "aria-label": `Bloque ${block}` });
      svg.append(svgElement("path", { d: nodePath(block), fill: "none", stroke: "currentColor", "stroke-width": "2.4" }));
      return slot(label, svg, block === "0000" ? "is-zero" : "");
    }

    function separator(isPoint) {
      const label = isPoint ? "." : "−";
      const svg = svgElement("svg", { viewBox: "-9 -50 18 100", role: "img", "aria-label": isPoint ? "Punto decimal" : "Menos" });
      svg.append(isPoint
        ? svgElement("circle", { cx: "0", cy: "0", r: "2.7", fill: "currentColor" })
        : svgElement("path", { d: "M-6 0H6", stroke: "currentColor", "stroke-width": "2.4" }));
      return slot(label, svg, "is-token");
    }

    const input = document.querySelector("#decimal-input");
    const hint = document.querySelector("#input-hint");
    const counts = document.querySelector("#counts");
    const stage = document.querySelector("#stage");
    const flow = document.querySelector("#flow");
    const empty = document.querySelector("#empty");
    const toggle = document.querySelector("#decimal-toggle");

    function render() {
      const value = parseDecimal(input.value);
      const invalid = !value && input.value.trim() !== "";
      input.setAttribute("aria-invalid", String(invalid));
      hint.classList.toggle("is-error", invalid);
      hint.textContent = invalid ? "Escribe un entero o un decimal con punto, por ejemplo -12.34." : "Usa un punto para los decimales.";
      empty.hidden = Boolean(value);
      flow.hidden = !value;
      flow.replaceChildren();
      counts.textContent = "";
      if (!value) return;

      const row = document.createDocumentFragment();
      if (value.negative) row.append(separator(false));
      value.integerBlocks.forEach((block, index) => row.append(glyph(block, index === 0 ? block.replace(/^0+(?=[0-9])/, "") : block)));
      if (value.fractionalBlocks.length) {
        row.append(separator(true));
        value.fractionalBlocks.forEach((block, index) => row.append(glyph(block, value.fraction.slice(index * 4, index * 4 + 4))));
      }
      flow.append(row);
      stage.scrollLeft = 0;
      const blocks = value.integerBlocks.length + value.fractionalBlocks.length;
      const digits = value.integer.length + value.fraction.length;
      counts.textContent = `${blocks} ${blocks === 1 ? "bloque" : "bloques"} · ${digits} ${digits === 1 ? "cifra" : "cifras"}`;
    }

    input.addEventListener("input", render);
    toggle.addEventListener("change", () => flow.classList.toggle("without-decimal", !toggle.checked));
    for (const button of document.querySelectorAll("[data-number]")) {
      button.addEventListener("click", () => {
        input.value = button.dataset.number;
        render();
      });
    }
    render();
  </script>
</body>
</html>
